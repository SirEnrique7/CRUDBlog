<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
</head>
<body>
    <header>
        <a href="{% url 'post_list' %}"><h1>My Blog</h1></a>
        <nav>
            <ul>
                <a href="{% url 'post_create' %}">Nueva publicacion</a>
            </ul>
        </nav>

        <!-- login y log out -->
        {% if user.is_authenticated %}
            <p>Bienvenido, {{ user.username }}!</p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Cerrar sesión</button>
            </form>

        {% else %}
            <a href="{% url 'login' %}">Iniciar sesión</a> |
            <a href="{% url 'signup' %}">Registrarse</a>
        {% endif %}
        
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2023 Blog</p>
    </footer>
</body>
</html>
